[package]
name = "ailive-gun-spirit-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "A.I.Live ai枪娘器灵 Linux/desktop integration host"
default-run = "ailive-gun-spirit-host"

[lints]
workspace = true

[dependencies]
# default-features 关掉；由本 crate 的 `std` feature 决定下游是否启用 std。
# 这样 `--no-default-features` 就能让 contracts/perception-core 走 no_std+alloc，
# 而 host 自身始终是 std 二进制——CP1 的双配置等价对拍依赖这一点。
ailive-gun-spirit-contracts = { path = "../ailive-gun-spirit-contracts", default-features = false }
ailive-gun-spirit-perception-core = { path = "../ailive-gun-spirit-perception-core", default-features = false }
oclive_kernel_host.workspace = true
oclive_kernel_runtime.workspace = true
oclive_kernel_types.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
oclive_monolith_builtin = { path = "../../vendor/oclive_monolith_builtin", optional = true }

[features]
default = ["std"]
# 下游（contracts / perception-core）的 std 开关；host 自身始终使用 std。
std = [
    "ailive-gun-spirit-contracts/std",
    "ailive-gun-spirit-perception-core/std",
]
monolith = ["dep:oclive_monolith_builtin"]

[[bin]]
name = "ailive-gun-spirit-host"
path = "src/main.rs"

[[bin]]
name = "ailive-gun-spirit-host-monolith"
path = "src/main_monolith.rs"
required-features = ["monolith"]

[[bin]]
name = "ailive-gun-spirit-sim"
path = "src/bin/simulator.rs"
