[package]
name = "ailive-gun-spirit-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "A.I.Live ai枪娘器灵 Linux/desktop integration host"
default-run = "ailive-gun-spirit-host"

[lints]
workspace = true

[dependencies]
ailive-gun-spirit-contracts = { path = "../ailive-gun-spirit-contracts" }
ailive-gun-spirit-perception-core = { path = "../ailive-gun-spirit-perception-core" }
oclive_kernel_host.workspace = true
oclive_kernel_runtime.workspace = true
oclive_kernel_types.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
oclive_monolith_builtin = { path = "../../vendor/oclive_monolith_builtin", optional = true }

[features]
default = []
monolith = ["dep:oclive_monolith_builtin"]

[[bin]]
name = "ailive-gun-spirit-host"
path = "src/main.rs"

[[bin]]
name = "ailive-gun-spirit-host-monolith"
path = "src/main_monolith.rs"
required-features = ["monolith"]

[[bin]]
name = "ailive-gun-spirit-sim"
path = "src/bin/simulator.rs"
