[workspace]
resolver = "2"
members = [
    "crates/ailive-gun-spirit-contracts",
    "crates/ailive-gun-spirit-perception-core",
    "crates/ailive-gun-spirit-host",
]
exclude = ["vendor/oclive_monolith_builtin"]
default-members = ["crates/ailive-gun-spirit-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
authors = ["supermumu"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[workspace.dependencies]
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OCLive stays in its sibling repository. Only the integration host may depend on it.
oclive_kernel_host = { path = "../oclivenewnew/kernel/crates/oclive_kernel_host" }
oclive_kernel_runtime = { path = "../oclivenewnew/kernel/crates/oclive_kernel_runtime" }
oclive_kernel_types = { path = "../oclivenewnew/kernel/crates/oclive_kernel_types" }
