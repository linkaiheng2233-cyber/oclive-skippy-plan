[package]
name = "ailive-gun-spirit-perception-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description = "Deterministic physical fact fusion and edge derivation"

[lints]
workspace = true

[features]
default = ["std"]
# 关闭 std 后本 crate 在 no_std + alloc 下编译，供枪侧固件复用同一份融合实现（CP1）。
std = ["ailive-gun-spirit-contracts/std"]

[dependencies]
ailive-gun-spirit-contracts = { path = "../ailive-gun-spirit-contracts", default-features = false }
